[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smr-dc-cogen"
version = "1.0.1"
description = "Hourly co-optimization of small-modular-reactor cogeneration (steam extraction to absorption cooling) for a data center's IT and cooling loads against grid supply (framework of Li, She & Zhang, arXiv:2608.10999)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
# Lower bounds = oldest versions the test suite was run with (and passed); newest tested: see environment.yml
dependencies = ["numpy>=1.26", "pandas>=2.2", "xarray>=2024.6", "linopy>=0.4.4", "highspy>=1.7.2"]
keywords = ["small modular reactor", "cogeneration", "data centers", "absorption cooling", "techno-economic analysis", "mixed-integer programming"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gurobi = ["gurobipy"]
test = ["pytest"]

[project.scripts]
smr-dc-cogen = "smr_dc_cogen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
